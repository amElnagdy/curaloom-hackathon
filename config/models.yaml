# Role routing for the provider layer (ADR-002). Switching a role's model is an edit here.
# The mode (live | record | replay) comes from PROVIDER_PROFILE in .env, not from this file.

roles:
  agent_default: { provider: meta, model: muse-spark-1.3, reasoning: medium }
  # Wonder's output tokens, reasoning included, are the plan's main cost (#18).
  curriculum: { provider: meta, model: muse-wonder-1.0, max_output_tokens: 12000 }
  judge: { provider: meta, model: muse-spark-1.3 }
  # The coach's short messages (#25); #29 can move them to Glimmer here.
  coach: { provider: meta, model: muse-spark-1.3, reasoning: low }
  transcribe: { provider: meta, model: muse-voice-transcribe-1.0 }
  segment: { provider: meta, model: sam-3.1 }
  image_edit: { provider: meta, model: muse-image-1.0 }

# USD, standard mode. Tokens per 1M; every model a role uses needs an entry.
prices:
  muse-spark-1.3: { input: 1.25, cached_input: 0.15, output: 4.25 }
  muse-wonder-1.0: { input: 4.0, cached_input: 0.2, output: 20.0 }
  muse-voice-transcribe-1.0: { per_audio_hour: 0.18 }
  muse-image-1.0: { per_image: 0.01 }
  sam-3.1: { per_image: 0.0025 }

# USD per billed web search (an `open_page` action is not billed).
tool_prices:
  web_search: 0.0025
